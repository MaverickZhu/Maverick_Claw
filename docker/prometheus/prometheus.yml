global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: maverick-claw-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:31987
        labels:
          service: maverick-claw

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
